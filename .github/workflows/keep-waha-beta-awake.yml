name: Keep WAHA Beta awake

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: waha-beta-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Verificar WAHA Beta
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 150 \
            https://dona-capivara-waha-beta.onrender.com/ping
